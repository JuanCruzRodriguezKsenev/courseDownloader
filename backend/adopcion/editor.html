<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor de Adopción — Classroom</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --warning-border: #fde68a;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --badge-ya-esta: #64748b;
      --badge-dup: #8b5cf6;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-alt: #334155;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --danger: #ef4444;
        --danger-bg: #450a0a;
        --danger-border: #7f1d1d;
        --warning: #f59e0b;
        --warning-bg: #451a03;
        --warning-border: #78350f;
        --success: #22c55e;
        --success-bg: #052e16;
        --success-border: #14532d;
        --badge-ya-esta: #94a3b8;
        --badge-dup: #a78bfa;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    /* Barra fija superior */
    header.barra-fija {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      padding: 10px 16px;
    }

    .barra-contenido {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .contadores {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .contador-chip {
      background-color: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      display: flex;
      gap: 6px;
    }

    .contador-chip.choques-alerta {
      background-color: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger);
      font-weight: 600;
    }

    .estado-guardado {
      font-size: 12px;
      color: var(--warning);
      font-weight: 500;
      display: none;
    }
    .estado-guardado.visible {
      display: inline-block;
    }

    .acciones-barra {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--text);
      transition: background-color 0.15s;
    }
    button:hover:not(:disabled) {
      background-color: var(--surface-alt);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    button.btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    /* Panel desplegable de resultados */
    #panel-resultados {
      max-width: 1200px;
      margin: 8px auto 0;
      display: none;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    #panel-resultados.visible {
      display: block;
    }
    #panel-resultados .cabecera-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    #panel-resultados pre {
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 240px;
      overflow-y: auto;
      background-color: var(--surface-alt);
      padding: 8px;
      border-radius: 4px;
    }
    .resaltar-copiar {
      color: var(--success);
      font-weight: bold;
    }

    /* Contenedor principal */
    main.contenedor {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Barra de cursos */
    #barra-cursos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button.pestana-curso {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: border-color 0.15s, background-color 0.15s;
    }

    button.pestana-curso:hover:not(:disabled) {
      background-color: var(--surface-alt);
    }

    button.pestana-curso[aria-selected="true"],
    button.pestana-curso.activa {
      border-color: var(--primary);
      background-color: var(--surface-alt);
      font-weight: 600;
    }

    .pestana-nombre {
      display: inline-block;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }

    .pestana-items {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Sección curso activo */
    section.seccion {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    #cabecera-curso {
      margin-bottom: 16px;
    }

    .curso-titulo-cabecera {
      margin-bottom: 8px;
    }

    .curso-titulo-cabecera h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .tabla-curso-cabecera {
      margin-bottom: 8px;
    }

    .seccion-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .filtros input[type="text"] {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background-color: var(--surface);
      color: var(--text);
    }

    .tabla-scroll {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    th {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Cursos atenuados */
    .curso-vacio {
      opacity: 0.5;
    }

    /* Subtexto gris en cursos */
    .ruta-teorias-info {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Temas */
    #temas-curso {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tema {
      border: 1px solid var(--border);
      border-radius: 6px;
      background-color: var(--surface);
      overflow: hidden;
    }

    .tema-cabecera {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background-color: var(--surface-alt);
      border-bottom: 1px solid var(--border);
    }

    .tema-cabecera button.tema-toggle {
      background: none;
      border: none;
      font-size: 14px;
      padding: 2px 6px;
      cursor: pointer;
      color: var(--text);
    }

    .tema-cabecera .tema-nombre {
      font-weight: 600;
      font-size: 14px;
    }

    .tema-cabecera .tema-items {
      font-size: 12px;
      color: var(--text-muted);
    }

    .tema-cabecera select.tema-destino {
      width: auto;
      min-width: 180px;
      max-width: 250px;
    }

    .tema-archivos {
      padding: 0;
    }

    #curso-sin-archivos {
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Badges / Insignias */
    [hidden] { display: none !important; } /* las clases con display pisan al atributo */
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-sin-regla,
    .insignia-sin-regla {
      background-color: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning);
    }
    .badge-ya-esta {
      background-color: var(--surface-alt);
      color: var(--badge-ya-esta);
      border: 1px solid var(--border);
    }
    .badge-dup {
      background-color: var(--surface-alt);
      color: var(--badge-dup);
      border: 1px solid var(--border);
    }
    .badge-choque,
    .insignia-choques {
      background-color: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      font-weight: 600;
    }

    /* Filas con choque */
    tr.fila-choque {
      background-color: var(--danger-bg) !important;
    }
    tr.fila-choque td {
      border-bottom-color: var(--danger-border);
    }
    .leyenda-choque {
      color: var(--danger);
      font-size: 11px;
      font-weight: 600;
      display: block;
      margin-top: 4px;
    }

    /* Destino en vivo */
    .destino-vivo {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      word-break: break-all;
    }

    /* Inputs y selects */
    select, input[type="text"] {
      width: 100%;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background-color: var(--surface);
      color: var(--text);
      font-size: 13px;
    }
    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
    }
    select:disabled, input[type="text"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background-color: var(--surface-alt);
    }

    .col-accion {
      white-space: nowrap;
      width: 110px;
    }
    .col-nombre {
      min-width: 200px;
    }
    .col-destino-vivo {
      min-width: 220px;
    }
  </style>
</head>
<body>
  <header class="barra-fija">
    <div class="barra-contenido">
      <div class="contadores">
        <div class="contador-chip"><span>A copiar:</span> <strong id="cnt-copiar">0</strong></div>
        <div class="contador-chip"><span>Ya están:</span> <strong id="cnt-ya-esta">0</strong></div>
        <div class="contador-chip"><span>Duplicados:</span> <strong id="cnt-duplicado">0</strong></div>
        <div class="contador-chip"><span>Omitidos:</span> <strong id="cnt-omitir">0</strong></div>
        <div class="contador-chip" id="chip-choques"><span>Choques:</span> <strong id="cnt-choques">0</strong></div>
      </div>
      <div class="acciones-barra">
        <span class="estado-guardado" id="aviso-cambios">● Cambios sin guardar</span>
        <button id="btn-guardar" class="btn-primary">Guardar</button>
        <button id="btn-probar">Probar</button>
      </div>
    </div>
    <div id="panel-resultados">
      <div class="cabecera-panel">
        <strong id="titulo-panel">Resultado</strong>
        <button id="btn-cerrar-panel" style="padding: 2px 8px; font-size: 11px;">Cerrar</button>
      </div>
      <pre id="contenido-panel"></pre>
    </div>
  </header>

  <main class="contenedor">
    <nav id="barra-cursos" role="tablist"></nav>
    <section class="seccion" id="sec-curso">
      <div id="cabecera-curso"></div>
      <div class="seccion-header">
        <div class="filtros">
          <input type="text" id="filtro-texto-archivos" placeholder="Buscar por original o nombre...">
          <label><input type="checkbox" id="filtro-sin-regla"> Sólo sin regla</label>
          <label><input type="checkbox" id="filtro-solo-choques"> Sólo choques</label>
          <label><input type="checkbox" id="filtro-solo-copiar"> Sólo a copiar</label>
        </div>
      </div>
      <div id="temas-curso"></div>
    </section>
  </main>

  <script>
    // Estado en memoria
    let DATOS = null;
    let ESTADO_INICIAL_JSON = "";
    let HAY_CAMBIOS = false;
    let GRUPOS_CHOQUE = new Map(); // claveGrupo -> Grupo
    let FILAS_CON_CHOQUE = new Set(); // clave -> mensaje choque
    let CURSO_ACTIVO = null; // clave_curso
    const TEMAS_ABIERTOS = new Map(); // clave_curso\ttema -> true/false

    // Replica de resolverCarpeta de core/destino/carpetas.ts
    function resolverCarpeta(destino, docente) {
      const d = (docente || "").trim();
      if (destino === "Teorias" && d.length > 0) {
        return `Teorias/${d}`;
      }
      return destino;
    }

    function marcarCambio() {
      const actualJson = JSON.stringify({
        cursos: DATOS.cursos,
        temas: DATOS.temas,
        archivos: DATOS.archivos,
      });
      HAY_CAMBIOS = actualJson !== ESTADO_INICIAL_JSON;
      const aviso = document.getElementById("aviso-cambios");
      if (HAY_CAMBIOS) {
        aviso.classList.add("visible");
      } else {
        aviso.classList.remove("visible");
      }
    }

    window.addEventListener("beforeunload", (e) => {
      if (HAY_CAMBIOS) {
        e.preventDefault();
        e.returnValue = "";
      }
    });

    async function cargarDatos() {
      try {
        const res = await fetch("api/datos" + location.search);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || ("Error HTTP " + res.status));
        }
        DATOS = await res.json();
        if (DATOS.vacio) {
          const main = document.querySelector("main.contenedor");
          if (main) {
            main.innerHTML = `<div id="editor-vacio" style="padding: 40px; text-align: center; color: var(--text-muted); font-size: 14px;">${DATOS.error || "No hay cursos escaneados en memoria. Volvé a abrir esto desde el popup."}</div>`;
          }
          return;
        }
        ESTADO_INICIAL_JSON = JSON.stringify({
          cursos: DATOS.cursos,
          temas: DATOS.temas,
          archivos: DATOS.archivos,
        });
        HAY_CAMBIOS = false;
        document.getElementById("aviso-cambios").classList.remove("visible");
        renderizarTodo();
      } catch (err) {
        alert("Error al cargar datos: " + err.message);
      }
    }

    function recalcularChoques() {
      // Mismo criterio que buscarChoques de core/destino/choques.ts
      // Entran filas copiar cuyo tema no sea '-' y las ya-esta con materia/carpeta/nombre
      const grupos = new Map();
      const cursoPorClave = new Map(DATOS.cursos.map((c) => [c.clave_curso, c]));
      const temaPorClave = new Map(DATOS.temas.map((t) => [`${t.clave_curso}\t${t.tema}`, t]));

      for (const arch of DATOS.archivos) {
        const curso = cursoPorClave.get(arch.clave_curso);
        const materia = curso ? curso.materia : "";
        const tema = temaPorClave.get(`${arch.clave_curso}\t${arch.tema}`);
        const destinoTema = tema ? tema.destino : ".";

        let rutaBase = "";
        let nombre = arch.nombre;

        if (arch.accion === "ya-esta") {
          const carp = (arch.carpeta && arch.carpeta !== ".") ? arch.carpeta : "";
          rutaBase = carp ? (materia ? `${materia}/${carp}` : carp) : (materia || ".");
        } else if (arch.accion === "copiar") {
          if (destinoTema === "-") {
            continue; // Se omite el tema completo
          }
          const carp = resolverCarpeta(destinoTema, curso ? curso.docente : "");
          const carpNorm = (carp && carp !== ".") ? carp : "";
          rutaBase = carpNorm ? (materia ? `${materia}/${carpNorm}` : carpNorm) : (materia || ".");
        } else {
          continue;
        }

        const rutaNorm = rutaBase.replace(/\/+$/, "");
        const claveGrupo = `${rutaNorm}/${nombre}`.toLowerCase();
        const arr = grupos.get(claveGrupo) || [];
        arr.push({
          clave: arch.clave,
          md5: (arch.md5 || "").toLowerCase(),
          original: arch.original,
          nombre: arch.nombre,
          ruta: rutaNorm,
        });
        grupos.set(claveGrupo, arr);
      }

      GRUPOS_CHOQUE = new Map();
      FILAS_CON_CHOQUE = new Set();
      let cantGruposChoque = 0;

      for (const [claveGrupo, arr] of grupos.entries()) {
        const md5s = new Set(arr.map((f) => f.md5));
        if (md5s.size > 1 && arr.length > 0) {
          cantGruposChoque++;
          GRUPOS_CHOQUE.set(claveGrupo, arr);
          for (const f of arr) {
            FILAS_CON_CHOQUE.add(f.clave);
          }
        }
      }

      // Actualizar contadores
      let cntCopiar = 0;
      let cntYaEsta = 0;
      let cntDup = 0;
      let cntOmitir = 0;

      for (const a of DATOS.archivos) {
        if (a.accion === "copiar") cntCopiar++;
        else if (a.accion === "ya-esta") cntYaEsta++;
        else if (a.accion === "duplicado") cntDup++;
        else if (a.accion === "omitir") cntOmitir++;
      }

      document.getElementById("cnt-copiar").textContent = cntCopiar;
      document.getElementById("cnt-ya-esta").textContent = cntYaEsta;
      document.getElementById("cnt-duplicado").textContent = cntDup;
      document.getElementById("cnt-omitir").textContent = cntOmitir;
      document.getElementById("cnt-choques").textContent = cantGruposChoque;

      const chipChoques = document.getElementById("chip-choques");
      if (cantGruposChoque > 0) {
        chipChoques.classList.add("choques-alerta");
      } else {
        chipChoques.classList.remove("choques-alerta");
      }

      actualizarInsignias();
    }

    function elegirCursoInicial() {
      if (CURSO_ACTIVO && DATOS.cursos.some((c) => c.clave_curso === CURSO_ACTIVO)) {
        return;
      }
      if (DATOS.claveCursoActivo && DATOS.cursos.some((c) => c.clave_curso === DATOS.claveCursoActivo)) {
        CURSO_ACTIVO = DATOS.claveCursoActivo;
        return;
      }

      // Primero con choques o sin regla (orden de cursos.tsv)
      for (const c of DATOS.cursos) {
        const tieneChoques = DATOS.archivos.some(
          (a) => a.clave_curso === c.clave_curso && FILAS_CON_CHOQUE.has(a.clave)
        );
        const tieneSinRegla = DATOS.temas.some(
          (t) => t.clave_curso === c.clave_curso && t.regla === "no"
        );
        if (tieneChoques || tieneSinRegla) {
          CURSO_ACTIVO = c.clave_curso;
          return;
        }
      }

      // Si no hay ninguno, el primero con archivos
      for (const c of DATOS.cursos) {
        const cantArchivos = parseInt(c.items || "0", 10);
        if (cantArchivos > 0) {
          CURSO_ACTIVO = c.clave_curso;
          return;
        }
      }

      // Fallback
      if (DATOS.cursos.length > 0) {
        CURSO_ACTIVO = DATOS.cursos[0].clave_curso;
      }
    }

    function renderizarTodo() {
      recalcularChoques();
      elegirCursoInicial();
      renderizarBarra();
      renderizarCurso();
    }

    function renderizarBarra() {
      const barra = document.getElementById("barra-cursos");
      barra.innerHTML = "";

      for (const curso of DATOS.cursos) {
        const btn = document.createElement("button");
        btn.className = "pestana-curso";
        btn.dataset.curso = curso.clave_curso;
        btn.setAttribute("role", "tab");

        const esActivo = curso.clave_curso === CURSO_ACTIVO;
        if (esActivo) {
          btn.setAttribute("aria-selected", "true");
          btn.classList.add("activa");
        } else {
          btn.setAttribute("aria-selected", "false");
        }

        const itemsCount = parseInt(curso.items || "0", 10);
        if (itemsCount === 0) {
          btn.classList.add("curso-vacio");
        }

        const spanNombre = document.createElement("span");
        spanNombre.className = "pestana-nombre";
        spanNombre.textContent = curso.nombre;
        spanNombre.title = curso.nombre;
        btn.appendChild(spanNombre);

        const spanItems = document.createElement("span");
        spanItems.className = "pestana-items";
        spanItems.textContent = curso.items || "0";
        btn.appendChild(spanItems);

        let cantSinRegla = 0;
        for (const t of DATOS.temas) {
          if (t.clave_curso === curso.clave_curso && t.regla === "no") {
            cantSinRegla++;
          }
        }
        let cantChoques = 0;
        for (const a of DATOS.archivos) {
          if (a.clave_curso === curso.clave_curso && FILAS_CON_CHOQUE.has(a.clave)) {
            cantChoques++;
          }
        }

        const spanSinRegla = document.createElement("span");
        spanSinRegla.className = "insignia-sin-regla badge badge-sin-regla";
        spanSinRegla.textContent = cantSinRegla;
        spanSinRegla.hidden = cantSinRegla === 0;
        btn.appendChild(spanSinRegla);

        const spanChoques = document.createElement("span");
        spanChoques.className = "insignia-choques badge badge-choque";
        spanChoques.textContent = cantChoques;
        spanChoques.hidden = cantChoques === 0;
        btn.appendChild(spanChoques);

        btn.addEventListener("click", () => {
          CURSO_ACTIVO = curso.clave_curso;
          renderizarBarra();
          renderizarCurso();
        });

        barra.appendChild(btn);
      }

      actualizarInsignias();
    }

    function renderizarCabeceraCurso(curso) {
      const contCabecera = document.getElementById("cabecera-curso");
      contCabecera.innerHTML = "";

      const esModoIndice = new URLSearchParams(location.search).get("modo") === "indice";
      const divTitulo = document.createElement("div");
      divTitulo.className = "curso-titulo-cabecera";
      const h2 = document.createElement("h2");
      if (esModoIndice && (!curso.materia || curso.materia.trim().length === 0)) {
        h2.textContent = "Asociar curso";
        const divSub = document.createElement("div");
        divSub.style.color = "var(--text-muted)";
        divSub.style.fontSize = "14px";
        divSub.textContent = curso.nombre;
        divTitulo.appendChild(h2);
        divTitulo.appendChild(divSub);
      } else {
        h2.textContent = curso.nombre;
        divTitulo.appendChild(h2);
      }
      contCabecera.appendChild(divTitulo);

      const tablaScroll = document.createElement("div");
      tablaScroll.className = "tabla-scroll";
      const table = document.createElement("table");
      table.className = "tabla-curso-cabecera";
      table.innerHTML = `
        <thead>
          <tr>
            <th style="width: 80px;">Ítems</th>
            <th style="width: 250px;">Materia</th>
            <th style="width: 250px;">Docente</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;
      const tbody = table.querySelector("tbody");
      const tr = document.createElement("tr");

      // 1. Ítems
      const tdItems = document.createElement("td");
      tdItems.textContent = curso.items || "0";
      tr.appendChild(tdItems);

      // 2. Materia
      const tdMateria = document.createElement("td");
      const selectMateria = document.createElement("select");
      const optVacia = document.createElement("option");
      optVacia.value = "";
      optVacia.textContent = "(sin materia)";
      selectMateria.appendChild(optVacia);

      for (const m of DATOS.materias) {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        selectMateria.appendChild(opt);
      }
      selectMateria.value = curso.materia || "";
      if (esModoIndice && curso.materia && curso.materia.trim().length > 0) {
        selectMateria.disabled = true;
      }
      tdMateria.appendChild(selectMateria);
      tr.appendChild(tdMateria);

      // 3. Docente
      const tdDocente = document.createElement("td");
      const inputDocente = document.createElement("input");
      inputDocente.type = "text";
      inputDocente.value = curso.docente || "";
      const listId = `dl-${curso.clave_curso.replace(/[^a-zA-Z0-9]/g, "_")}`;
      inputDocente.setAttribute("list", listId);

      const datalist = document.createElement("datalist");
      datalist.id = listId;
      tdDocente.appendChild(inputDocente);
      tdDocente.appendChild(datalist);

      const infoTeorias = document.createElement("div");
      infoTeorias.className = "ruta-teorias-info";
      tdDocente.appendChild(infoTeorias);

      function actualizarDatalistYInfo() {
        datalist.innerHTML = "";
        const materiaElegida = selectMateria.value;
        const docentesMat = (DATOS.docentes && DATOS.docentes[materiaElegida]) || [];
        for (const d of docentesMat) {
          const opt = document.createElement("option");
          opt.value = d;
          datalist.appendChild(opt);
        }

        const docVal = inputDocente.value.trim();
        if (!materiaElegida) {
          infoTeorias.textContent = "(sin materia)";
        } else if (docVal) {
          infoTeorias.textContent = `Teorías va a ${materiaElegida}/Teorias/${docVal}`;
        } else {
          infoTeorias.textContent = `Teorías va a ${materiaElegida}/Teorias`;
        }
      }

      actualizarDatalistYInfo();

      selectMateria.addEventListener("change", () => {
        curso.materia = selectMateria.value;
        actualizarDatalistYInfo();
        marcarCambio();
        recalcularChoques();
        actualizarDestinosEnVivo();
      });

      inputDocente.addEventListener("input", () => {
        curso.docente = inputDocente.value;
        actualizarDatalistYInfo();
        marcarCambio();
        recalcularChoques();
        actualizarDestinosEnVivo();
      });

      tr.appendChild(tdDocente);
      tbody.appendChild(tr);
      tablaScroll.appendChild(table);
      contCabecera.appendChild(tablaScroll);
    }

    function crearFilaArchivo(arch, primeraFilaPorMd5) {
      const tr = document.createElement("tr");
      tr.id = `fila-arch-${arch.clave}`;
      const esChoque = FILAS_CON_CHOQUE.has(arch.clave);
      if (esChoque) {
        tr.classList.add("fila-choque");
      }

      // 1. Original
      const tdOrig = document.createElement("td");
      tdOrig.textContent = arch.original;
      tr.appendChild(tdOrig);

      // 2. Acción
      const tdAccion = document.createElement("td");
      tdAccion.className = "col-accion";

      // 3. Nombre
      const tdNombre = document.createElement("td");
      tdNombre.className = "col-nombre";

      // 4. Destino en vivo
      const tdDestinoVivo = document.createElement("td");
      tdDestinoVivo.className = "col-destino-vivo";

      const spanDestino = document.createElement("div");
      spanDestino.className = "destino-vivo";
      tdDestinoVivo.appendChild(spanDestino);

      const spanLeyendaChoque = document.createElement("span");
      spanLeyendaChoque.className = "leyenda-choque";
      spanLeyendaChoque.textContent = "mismo destino que otro archivo distinto: cambiá el nombre";
      spanLeyendaChoque.style.display = esChoque ? "block" : "none";
      tdDestinoVivo.appendChild(spanLeyendaChoque);

      // Casos según el tipo de fila
      if (arch.accion === "ya-esta") {
        const badgeYaEsta = document.createElement("span");
        badgeYaEsta.className = "badge badge-ya-esta";
        badgeYaEsta.textContent = "ya está";
        tdAccion.appendChild(badgeYaEsta);
        tdNombre.textContent = arch.nombre;
      } else if (arch.accion === "duplicado") {
        const hash = (arch.md5 || "").toLowerCase();
        const primera = primeraFilaPorMd5.get(hash);
        const nombrePrimera = primera ? primera.nombre : arch.nombre;

        const badgeDup = document.createElement("span");
        badgeDup.className = "badge badge-dup";
        badgeDup.textContent = "duplicado";
        tdAccion.appendChild(badgeDup);

        const badgeIgual = document.createElement("span");
        badgeIgual.className = "badge badge-dup";
        badgeIgual.id = `dup-badge-${arch.clave}`;
        badgeIgual.textContent = `igual a ${nombrePrimera}`;
        tdNombre.appendChild(badgeIgual);
      } else {
        // copiar u omitir
        const selectAccion = document.createElement("select");
        selectAccion.id = `sel-acc-${arch.clave}`;
        const optCopiar = document.createElement("option");
        optCopiar.value = "copiar";
        optCopiar.textContent = "copiar";
        const optOmitir = document.createElement("option");
        optOmitir.value = "omitir";
        optOmitir.textContent = "omitir";
        selectAccion.appendChild(optCopiar);
        selectAccion.appendChild(optOmitir);
        selectAccion.value = arch.accion;
        tdAccion.appendChild(selectAccion);

        const inputNombre = document.createElement("input");
        inputNombre.type = "text";
        inputNombre.value = arch.nombre;
        inputNombre.id = `inp-nom-${arch.clave}`;
        tdNombre.appendChild(inputNombre);

        selectAccion.addEventListener("change", () => {
          arch.accion = selectAccion.value;
          marcarCambio();
          recalcularChoques();
          actualizarDestinosEnVivo();
        });

        inputNombre.addEventListener("input", () => {
          arch.nombre = inputNombre.value;
          marcarCambio();
          recalcularChoques();
          actualizarDestinosEnVivo();
        });
      }

      tr.appendChild(tdAccion);
      tr.appendChild(tdNombre);
      tr.appendChild(tdDestinoVivo);
      return tr;
    }

    function renderizarCurso() {
      const contCabecera = document.getElementById("cabecera-curso");
      const contTemas = document.getElementById("temas-curso");
      contCabecera.innerHTML = "";
      contTemas.innerHTML = "";

      if (!CURSO_ACTIVO) return;

      const curso = DATOS.cursos.find((c) => c.clave_curso === CURSO_ACTIVO);
      if (!curso) return;

      renderizarCabeceraCurso(curso);

      const cantArchivosCurso = DATOS.archivos.filter((a) => a.clave_curso === CURSO_ACTIVO).length;
      if (cantArchivosCurso === 0) {
        const divSin = document.createElement("div");
        divSin.id = "curso-sin-archivos";
        divSin.textContent = "Este curso no tiene archivos.";
        contTemas.appendChild(divSin);
        return;
      }

      // Primera fila por md5 para duplicados
      const primeraFilaPorMd5 = new Map();
      for (const a of DATOS.archivos) {
        const hash = (a.md5 || "").toLowerCase();
        if (hash && !primeraFilaPorMd5.has(hash)) {
          primeraFilaPorMd5.set(hash, a);
        }
      }

      const textoFiltro = (document.getElementById("filtro-texto-archivos").value || "").toLowerCase().trim();
      const soloSinRegla = document.getElementById("filtro-sin-regla").checked;
      const soloChoques = document.getElementById("filtro-solo-choques").checked;
      const soloCopiar = document.getElementById("filtro-solo-copiar").checked;
      const hayFiltrosArchivos = Boolean(textoFiltro || soloChoques || soloCopiar);

      // Temas del curso en el orden de temas.tsv
      const temasDelCurso = DATOS.temas.filter((t) => t.clave_curso === CURSO_ACTIVO);
      const nombresTemasSet = new Set(temasDelCurso.map((t) => t.tema));

      // Verificar si hay archivos cuyo tema no figura en temas.tsv
      const temasConArchivos = [...temasDelCurso];
      const archivosSinTema = DATOS.archivos.filter(
        (a) => a.clave_curso === CURSO_ACTIVO && !nombresTemasSet.has(a.tema)
      );
      if (archivosSinTema.length > 0) {
        temasConArchivos.push({
          clave_curso: CURSO_ACTIVO,
          tema: "(tema que no figura en temas.tsv)",
          items: String(archivosSinTema.length),
          destino: ".",
          regla: "no",
          esTemaHuerfano: true,
        });
      }

      for (const tema of temasConArchivos) {
        const sinRegla = tema.regla === "no";
        if (soloSinRegla && !sinRegla) continue;

        // Buscar archivos del tema
        const archivosTema = tema.esTemaHuerfano
          ? archivosSinTema
          : DATOS.archivos.filter(
              (a) => a.clave_curso === CURSO_ACTIVO && a.tema === tema.tema
            );

        const filtrados = [];
        let choquesEnTema = 0;

        for (const a of archivosTema) {
          const esChoque = FILAS_CON_CHOQUE.has(a.clave);
          if (esChoque) choquesEnTema++;

          if (soloChoques && !esChoque) continue;
          if (soloCopiar && a.accion !== "copiar") continue;
          if (textoFiltro) {
            const orig = (a.original || "").toLowerCase();
            const nom = (a.nombre || "").toLowerCase();
            if (!orig.includes(textoFiltro) && !nom.includes(textoFiltro)) {
              continue;
            }
          }
          filtrados.push(a);
        }

        if (hayFiltrosArchivos && filtrados.length === 0) {
          continue;
        }

        const keyTema = `${CURSO_ACTIVO}\t${tema.tema}`;
        let abierto = false;
        if (TEMAS_ABIERTOS.has(keyTema)) {
          abierto = TEMAS_ABIERTOS.get(keyTema);
        } else if (hayFiltrosArchivos) {
          abierto = filtrados.length > 0;
        } else {
          abierto = sinRegla || choquesEnTema > 0;
        }

        const divTema = document.createElement("div");
        divTema.className = "tema";
        divTema.dataset.tema = tema.tema;

        // Cabecera tema
        const divCabecera = document.createElement("div");
        divCabecera.className = "tema-cabecera";

        const btnToggle = document.createElement("button");
        btnToggle.className = "tema-toggle";
        btnToggle.type = "button";
        btnToggle.textContent = abierto ? "▾" : "▸";
        btnToggle.setAttribute("aria-expanded", abierto ? "true" : "false");
        divCabecera.appendChild(btnToggle);

        const spanNombre = document.createElement("span");
        spanNombre.className = "tema-nombre";
        spanNombre.textContent = tema.tema;
        divCabecera.appendChild(spanNombre);

        const spanItems = document.createElement("span");
        spanItems.className = "tema-items";
        spanItems.textContent = `(${tema.items} ítems)`;
        divCabecera.appendChild(spanItems);

        if (!tema.esTemaHuerfano) {
          const selectDestino = document.createElement("select");
          selectDestino.className = "tema-destino";
          for (const d of DATOS.destinos) {
            const opt = document.createElement("option");
            opt.value = d;
            opt.textContent = d;
            selectDestino.appendChild(opt);
          }
          const optOmitir = document.createElement("option");
          optOmitir.value = "-";
          optOmitir.textContent = "- (no bajar este tema)";
          selectDestino.appendChild(optOmitir);

          selectDestino.value = tema.destino;
          selectDestino.addEventListener("change", () => {
            tema.destino = selectDestino.value;
            marcarCambio();
            recalcularChoques();
            actualizarDestinosEnVivo();
            actualizarInsignias();
          });
          divCabecera.appendChild(selectDestino);

          const spanRegla = document.createElement("span");
          spanRegla.className = "tema-regla";
          if (sinRegla) {
            const badgeSinRegla = document.createElement("span");
            badgeSinRegla.className = "badge badge-sin-regla";
            badgeSinRegla.textContent = "sin regla — revisá";
            spanRegla.appendChild(badgeSinRegla);
          } else {
            const spanAuto = document.createElement("span");
            spanAuto.style.color = "var(--text-muted)";
            spanAuto.style.fontSize = "12px";
            spanAuto.textContent = "automática";
            spanRegla.appendChild(spanAuto);
          }
          divCabecera.appendChild(spanRegla);
        }

        const badgeChoque = document.createElement("span");
        badgeChoque.className = "insignia-choques badge badge-choque";
        badgeChoque.textContent = choquesEnTema;
        badgeChoque.hidden = choquesEnTema === 0;
        divCabecera.appendChild(badgeChoque);

        divTema.appendChild(divCabecera);

        // Contenedor archivos
        const divArchivos = document.createElement("div");
        divArchivos.className = "tema-archivos";
        divArchivos.hidden = !abierto;

        btnToggle.addEventListener("click", () => {
          const nuevoAbierto = divArchivos.hidden;
          divArchivos.hidden = !nuevoAbierto;
          btnToggle.textContent = nuevoAbierto ? "▾" : "▸";
          btnToggle.setAttribute("aria-expanded", nuevoAbierto ? "true" : "false");
          TEMAS_ABIERTOS.set(keyTema, nuevoAbierto);
        });

        const tablaScroll = document.createElement("div");
        tablaScroll.className = "tabla-scroll";
        const table = document.createElement("table");
        table.innerHTML = `
          <thead>
            <tr>
              <th style="min-width: 180px;">Original</th>
              <th class="col-accion">Acción</th>
              <th class="col-nombre">Nombre</th>
              <th class="col-destino-vivo">Destino en vivo</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector("tbody");

        for (const arch of filtrados) {
          const tr = crearFilaArchivo(arch, primeraFilaPorMd5);
          tbody.appendChild(tr);
        }

        tablaScroll.appendChild(table);
        divArchivos.appendChild(tablaScroll);
        divTema.appendChild(divArchivos);

        contTemas.appendChild(divTema);
      }

      actualizarDestinosEnVivo();
    }

    function actualizarInsignias() {
      const barra = document.getElementById("barra-cursos");
      if (!barra || !barra.children.length) return;

      // 1. Barra de cursos
      for (const btn of barra.children) {
        const claveCurso = btn.dataset.curso;
        let cantSinRegla = 0;
        for (const t of DATOS.temas) {
          if (t.clave_curso === claveCurso && t.regla === "no") {
            cantSinRegla++;
          }
        }
        let cantChoques = 0;
        for (const a of DATOS.archivos) {
          if (a.clave_curso === claveCurso && FILAS_CON_CHOQUE.has(a.clave)) {
            cantChoques++;
          }
        }

        const spanSinRegla = btn.querySelector(".insignia-sin-regla");
        if (spanSinRegla) {
          spanSinRegla.textContent = cantSinRegla;
          spanSinRegla.hidden = cantSinRegla === 0;
        }

        const spanChoques = btn.querySelector(".insignia-choques");
        if (spanChoques) {
          spanChoques.textContent = cantChoques;
          spanChoques.hidden = cantChoques === 0;
        }
      }

      // 2. Temas del curso activo que estén en el DOM
      const contTemas = document.getElementById("temas-curso");
      if (contTemas) {
        const divsTema = contTemas.querySelectorAll("div.tema");
        for (const divTema of divsTema) {
          const nombreTema = divTema.dataset.tema;
          let choquesEnTema = 0;
          for (const a of DATOS.archivos) {
            if (a.clave_curso === CURSO_ACTIVO && a.tema === nombreTema && FILAS_CON_CHOQUE.has(a.clave)) {
              choquesEnTema++;
            }
          }
          const badgeChoque = divTema.querySelector(".insignia-choques");
          if (badgeChoque) {
            badgeChoque.textContent = choquesEnTema;
            badgeChoque.hidden = choquesEnTema === 0;
          }
        }
      }
    }

    function actualizarDestinosEnVivo() {
      if (!DATOS) return;
      const cursoPorClave = new Map(DATOS.cursos.map((c) => [c.clave_curso, c]));
      const temaPorClave = new Map(DATOS.temas.map((t) => [`${t.clave_curso}\t${t.tema}`, t]));

      // Primera fila por md5
      const primeraFilaPorMd5 = new Map();
      for (const a of DATOS.archivos) {
        const hash = (a.md5 || "").toLowerCase();
        if (hash && !primeraFilaPorMd5.has(hash)) {
          primeraFilaPorMd5.set(hash, a);
        }
      }

      for (const arch of DATOS.archivos) {
        const tr = document.getElementById(`fila-arch-${arch.clave}`);
        if (!tr) continue;

        const curso = cursoPorClave.get(arch.clave_curso);
        const materia = curso ? curso.materia : "";
        const tema = temaPorClave.get(`${arch.clave_curso}\t${arch.tema}`);
        const destinoTema = tema ? tema.destino : ".";

        const tdDestinoVivo = tr.querySelector(".destino-vivo");
        const leyendaChoque = tr.querySelector(".leyenda-choque");
        const selectAccion = tr.querySelector(`#${CSS.escape(`sel-acc-${arch.clave}`)}`);
        const inputNombre = tr.querySelector(`#${CSS.escape(`inp-nom-${arch.clave}`)}`);
        const badgeDup = tr.querySelector(`#${CSS.escape(`dup-badge-${arch.clave}`)}`);

        // Choque en fila
        const esChoque = FILAS_CON_CHOQUE.has(arch.clave);
        if (esChoque) {
          tr.classList.add("fila-choque");
          if (leyendaChoque) leyendaChoque.style.display = "block";
        } else {
          tr.classList.remove("fila-choque");
          if (leyendaChoque) leyendaChoque.style.display = "none";
        }

        // Duplicados siguen a la primera fila
        if (arch.accion === "duplicado") {
          const hash = (arch.md5 || "").toLowerCase();
          const primera = primeraFilaPorMd5.get(hash);
          if (primera && badgeDup) {
            badgeDup.textContent = `igual a ${primera.nombre}`;
          }
          if (primera) {
            const cPrim = cursoPorClave.get(primera.clave_curso);
            const tPrim = temaPorClave.get(`${primera.clave_curso}\t${primera.tema}`);
            const matPrim = cPrim ? cPrim.materia : "";
            const destPrim = tPrim ? tPrim.destino : ".";
            if (destPrim === "-") {
              tdDestinoVivo.textContent = "no se baja (tema)";
            } else if (primera.accion === "ya-esta") {
              const cNorm = (primera.carpeta && primera.carpeta !== ".") ? primera.carpeta : "";
              const rBase = cNorm ? (matPrim ? `${matPrim}/${cNorm}` : cNorm) : (matPrim || ".");
              tdDestinoVivo.textContent = `${rBase}/${primera.nombre}`;
            } else {
              const cRes = resolverCarpeta(destPrim, cPrim ? cPrim.docente : "");
              const cNorm = (cRes && cRes !== ".") ? cRes : "";
              const rBase = cNorm ? (matPrim ? `${matPrim}/${cNorm}` : cNorm) : (matPrim || "(sin materia)");
              tdDestinoVivo.textContent = `${rBase}/${primera.nombre}`;
            }
          }
          continue;
        }

        // Si el tema tiene destino '-'
        if (destinoTema === "-") {
          tdDestinoVivo.textContent = "no se baja (tema)";
          if (selectAccion) selectAccion.disabled = true;
          if (inputNombre) inputNombre.disabled = true;
          continue;
        } else {
          if (selectAccion) selectAccion.disabled = false;
          if (inputNombre) inputNombre.disabled = false;
        }

        if (arch.accion === "ya-esta") {
          const cNorm = (arch.carpeta && arch.carpeta !== ".") ? arch.carpeta : "";
          const rBase = cNorm ? (materia ? `${materia}/${cNorm}` : cNorm) : (materia || ".");
          tdDestinoVivo.textContent = `${rBase}/${arch.nombre}`;
        } else {
          // copiar u omitir
          const cRes = resolverCarpeta(destinoTema, curso ? curso.docente : "");
          const cNorm = (cRes && cRes !== ".") ? cRes : "";
          const rBase = cNorm ? (materia ? `${materia}/${cNorm}` : cNorm) : (materia || "(sin materia)");
          tdDestinoVivo.textContent = `${rBase}/${arch.nombre}`;
        }
      }
    }

    document.getElementById("filtro-texto-archivos").addEventListener("input", renderizarCurso);
    document.getElementById("filtro-sin-regla").addEventListener("change", renderizarCurso);
    document.getElementById("filtro-solo-choques").addEventListener("change", renderizarCurso);
    document.getElementById("filtro-solo-copiar").addEventListener("change", renderizarCurso);

    // Guardar
    async function ejecutarGuardar() {
      const btnGuardar = document.getElementById("btn-guardar");
      btnGuardar.disabled = true;
      try {
        const res = await fetch("api/guardar" + location.search, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            cursos: DATOS.cursos,
            temas: DATOS.temas,
            archivos: DATOS.archivos,
          }),
        });
        const data = await res.json();
        if (data.ok) {
          ESTADO_INICIAL_JSON = JSON.stringify({
            cursos: DATOS.cursos,
            temas: DATOS.temas,
            archivos: DATOS.archivos,
          });
          HAY_CAMBIOS = false;
          document.getElementById("aviso-cambios").classList.remove("visible");
          const esModoIndice = new URLSearchParams(location.search).get("modo") === "indice";
          const mensajeExito = esModoIndice
            ? "Los cambios se guardaron correctamente en el índice."
            : "Los cambios se guardaron correctamente en los archivos TSV.";
          mostrarResultado("Guardado", mensajeExito);
          return true;
        } else {
          const erroresTexto = (data.errores || []).join("\n");
          mostrarResultado("Errores al guardar", erroresTexto || "Ocurrió un error al guardar.");
          return false;
        }
      } catch (err) {
        mostrarResultado("Error", "Error de comunicación con el servidor: " + err.message);
        return false;
      } finally {
        btnGuardar.disabled = false;
      }
    }

    document.getElementById("btn-guardar").addEventListener("click", () => {
      ejecutarGuardar();
    });

    // Probar
    document.getElementById("btn-probar").addEventListener("click", async () => {
      const btnProbar = document.getElementById("btn-probar");
      btnProbar.disabled = true;
      try {
        const guardoOk = await ejecutarGuardar();
        if (!guardoOk) return;

        mostrarResultado("Ejecutando ensayo...", "Corriendo aplicar.js...");
        const res = await fetch("api/ensayo" + location.search, { method: "POST" });
        const data = await res.json();

        let salidaHtml = data.salida
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

        if (data.codigo === 0) {
          // Resaltar línea A copiar: N
          salidaHtml = salidaHtml.replace(
            /(A copiar:\s*\d+)/g,
            '<span class="resaltar-copiar">$1</span>'
          );
        }

        const panel = document.getElementById("panel-resultados");
        const titulo = document.getElementById("titulo-panel");
        const pre = document.getElementById("contenido-panel");
        titulo.textContent = `Resultado del ensayo (código ${data.codigo})`;
        pre.innerHTML = salidaHtml;
        panel.classList.add("visible");
      } catch (err) {
        mostrarResultado("Error en ensayo", "Error: " + err.message);
      } finally {
        btnProbar.disabled = false;
      }
    });

    function mostrarResultado(tituloTexto, contenidoTexto) {
      const panel = document.getElementById("panel-resultados");
      const titulo = document.getElementById("titulo-panel");
      const pre = document.getElementById("contenido-panel");
      titulo.textContent = tituloTexto;
      pre.textContent = contenidoTexto;
      panel.classList.add("visible");
    }

    document.getElementById("btn-cerrar-panel").addEventListener("click", () => {
      document.getElementById("panel-resultados").classList.remove("visible");
    });

    // Inicio
    cargarDatos();
  </script>
</body>
</html>
