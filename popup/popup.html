<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ramonnet Video Downloader</title>
  <link rel="stylesheet" href="globals.css">
</head>
<body>

  <div id="ui-loader" class="loader-overlay" aria-live="polite">
    <div class="spinner"></div>
    <div class="loader-text" id="ui-loader-txt">Leyendo pestaña Ramón Net...</div>
  </div>

  <!-- Overlay del Tutorial de Bienvenida (Onboarding).
       Isla Preact #3: todo el overlay lo renderiza features/onboarding.preact.js
       (carrusel + dots + navegación + estado del servidor derivado del daemon
       Conexion). Antes era markup estático manipulado imperativamente. Ver ADR-0006
       y docs/preact-migration.md. Este es sólo el punto de montaje. -->
  <div id="preact-onboarding"></div>

  <div class="container">
    <header class="header">
      <div class="header-left">
        <img src="../icons/icon48.png" alt="Logo de Ramón Net" width="20" height="20">
        <h4>RamonNet Downloader</h4>
      </div>
      <div class="header-right">
        <button id="ui-btn-help" class="btn-help-icon" title="Ver guía de uso y ayuda">❓</button>
        <!-- Isla Preact #1: el puntito de estado lo renderiza features/conexionHeader.preact.js
             (derivado del daemon Conexion). display:contents => el wrapper no afecta el layout flex. -->
        <span id="preact-status-dot" style="display:contents"></span>
      </div>
    </header>

    <section class="path-bar offline">
      <!-- Fila 1: Disco Físico -->
      <div class="meta-row row-pc">
        <span class="meta-label">📁 PC:</span>
        <!-- Isla Preact #1b: el texto de la ruta lo renderiza features/rutaDisco.preact.js
             (derivado del store RutaDisco). display:contents => el wrapper no rompe el flex. -->
        <span id="preact-pc-path" style="display:contents"></span>
        <button id="ui-btn-explore" class="btn-explore" title="Seleccionar carpeta raíz de descargas" disabled>
          📂 Explorar
        </button>
      </div>
      <!-- Fila 2: Materia y Cátedra del Aula Virtual -->
      <div class="meta-row row-aula">
        <span class="meta-label">📚 Materia:</span>
        <input type="text" id="ui-path-folder" class="input-path"
               placeholder="subcarpeta/vacia (ej: Biologia)"
               autocomplete="off" disabled>
        <span id="ui-catedra-badge" class="catedra-badge" title="Hacé click para cambiar de Cátedra" style="display:none"></span>
      </div>
    </section>

    <nav class="tabs-bar" role="tablist" aria-label="Secciones del descargador">
      <button id="tab-available" class="tab-btn active" role="tab" aria-selected="true" aria-controls="ui-list">Clases Disponibles</button>
      <button id="tab-queue" class="tab-btn" role="tab" aria-selected="false" aria-controls="ui-list">
        Fila de Descarga <span id="ui-queue-badge" class="tab-counter">0</span>
      </button>
    </nav>

    <section id="ui-filter-bar" class="filter-bar">
      <input type="text" id="ui-search" class="input-search" placeholder="Buscar clase..." disabled aria-label="Buscar clase">

      <div class="filter-dropdown" id="ui-filter-dropdown-container">
        <button id="ui-btn-filter-pills" class="pill-filter-btn" title="Filtrar clases" disabled>
          <span>Filtros</span>
          <span class="arrow">▼</span>
        </button>
        <div id="ui-filter-menu" class="filter-menu-popover" style="display: none;"></div>
      </div>

      <button id="ui-btn-sort" class="btn-sort" title="Cambiar orden (cronológico)" disabled>
        Sem. ↑
      </button>

      <button id="ui-btn-toggle-select" class="btn-sort" style="display:none" title="Activar selección múltiple">
        Seleccionar
      </button>

      <label class="master-select" id="ui-master-select-wrapper">
        <input type="checkbox" id="ui-master-check" disabled>
        <span>Todos</span>
      </label>
    </section>

    <main id="ui-list" class="list-wrapper" role="tabpanel" aria-labelledby="tab-available"></main>

    <footer class="footer-panel">
      <button id="ui-btn-action" class="btn-action" disabled>Conectando con el servidor... ⏳</button>

      <button id="ui-btn-start-queue" class="btn-action start-queue-style" style="display:none">Iniciar descarga masiva 🚀</button>

      <div class="download-separator"></div>

      <div id="ui-progress-container" class="progress-container" style="display:none">
        <div id="ui-progress-bar" class="progress-bar"></div>
      </div>

      <div id="ui-telemetry" class="telemetry-text" style="display:none">
        <span id="ui-tel-bytes">0.0 MB / 0.0 MB</span>
        <span id="ui-tel-speed">0.0 MB/s</span>
        <span id="ui-tel-frags">Frags: 0/0</span>
      </div>

      <p id="ui-msg-status" class="status-text" style="display:none"></p>

      <div id="ui-cancel-box" class="cancel-box" style="display:none">
        <button id="ui-btn-soft-cancel" class="btn-cancel" title="Termina el video actual y frena los siguientes">Frenar al terminar</button>
        <button id="ui-btn-hard-cancel" class="btn-cancel hard-stop" title="Detiene el proceso de descargas manteniendo la fila">Detener descargas 🚫</button>
      </div>
    </footer>
  </div>

  <script src="../shared/utils.js"></script>
  <script src="../shared/state.js"></script>
  <script src="../shared/bunClient.js"></script>
  <script src="../shared/conexion.js"></script>
  <script src="scraper.js"></script>
  <script src="../renderers.js"></script>
  <script src="features/serverConnection.js"></script>
  <script src="../popup.js"></script>
  <!-- Islas Preact (ES modules, sin build). Corren después de los scripts clásicos
       y antes de DOMContentLoaded, así que window.Conexion / window.AppState /
       window.OnboardingFeature ya existen cuando el handler DCL de popup.js corre.
       Ver ADR-0006. -->
  <script type="module" src="features/conexionHeader.preact.js"></script>
  <script type="module" src="features/onboarding.preact.js"></script>
  <script type="module" src="features/rutaDisco.preact.js"></script>
</body>
</html>
